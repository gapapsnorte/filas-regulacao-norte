name: Diagnóstico do acesso ao Mapa Social
on:
  workflow_dispatch:
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: curl -sS -o /dev/null -w "curl HTTP %{http_code} em %{time_total}s\n" https://paineis-ext.mpdft.mp.br/resources/js/qlik.js || true
      - run: python coleta/diagnostico.py
