name: Atualizar painel
on:
  schedule:
    # A cada 2 horas confere se o Mapa Social recarregou (ele recarrega 1 vez por dia, à noite).
    # Só coleta e publica quando há recarga nova ou quando o dia virou (para atualizar os dias de espera).
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      forcar:
        description: "Coletar mesmo sem recarga nova do Mapa Social"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: atualizar-painel
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - name: Coletar dados do Mapa Social (até 3 tentativas)
        id: coleta
        env:
          MAPA_CHROME_CANAL: ""
          PAINEL_DIR: ${{ github.workspace }}
          TZ: America/Sao_Paulo
          MODO: ${{ (github.event_name == 'workflow_dispatch' && inputs.forcar) && '--forcar' || '--se-mudou' }}
        run: |
          for i in 1 2 3; do
            python coleta/painel.py $MODO && exit 0
            echo "Tentativa $i falhou"; sleep 90
          done
          exit 1
      - name: Guardar os históricos (atraso e fila de espera) em main (um commit por dia com medição nova)
        if: steps.coleta.outputs.publicar == 'sim'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atraso.json espera.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Históricos do painel – $(TZ=America/Sao_Paulo date '+%d/%m/%Y')"
            if ! { git pull -q --rebase origin main && git push -q origin HEAD:main; }; then
              echo "::warning::não foi possível gravar atraso.json/espera.json em main; a publicação segue sem esse commit"
              git rebase --abort 2>/dev/null || true
              git reset -q HEAD~1   # desfaz o commit local e mantém os arquivos, para o git ficar limpo no passo seguinte
            fi
          fi
      - name: Publicar no branch gh-pages (código fica em main, com histórico; dados são substituídos a cada atualização)
        if: steps.coleta.outputs.publicar == 'sim'
        run: |
          git checkout --orphan gh-pages
          git rm -r -q --cached .
          git add -A -f -- index.html relatorio.js referencias.json dados.json devolvidas.json atraso.json espera.json analises detalhe README.md
          git commit -q -m "Painel – dados de $(TZ=America/Sao_Paulo date '+%F %H:%M')"
          git push -f origin gh-pages
